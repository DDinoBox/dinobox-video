id: engineering
label: 공학
version: 1

subtopics:
  - 건축공학
  - 토목공학
  - 도시공학
  - 기계공학
  - 항공공학
  - 유체역학
  - 밀리터리 엔지니어링

story_contract:
  required_core:
    - core_question
    - core_mechanism
    - visible_flow
    - unique_differentiator
  narrative_order:
    - constraint_or_common_belief
    - failure_growth
    - design_intervention
    - force_or_flow_change
    - structural_or_mechanical_response
    - performance_and_tradeoff
    - realistic_limit
    - conclusion
  visible_physics:
    - 공기
    - 물
    - 흙
    - 열
    - 압력
    - 하중
    - 진동
    - 에너지
  narrative_templates:
    problem_solution:
      - visible_problem
      - verified_cause
      - growing_risk
      - constraint
      - counterintuitive_intervention
      - mechanism
      - result_and_limit
    design_constraint:
      - impossible_requirement
      - conflicting_constraints
      - design_choice
      - force_or_flow_change
      - tradeoff
    hidden_mechanism:
      - strange_visible_effect
      - common_misconception
      - hidden_structure
      - mechanism_reveal
      - observable_result
    failure_analysis:
      - normal_state
      - initiating_fault
      - propagation
      - failure
      - lesson_or_redesign
    evolution_comparison:
      - earlier_method
      - limitation
      - changed_idea
      - mechanism_difference
      - result
    process_breakdown:
      - finished_result
      - sequence
      - hardest_step
      - controlling_mechanism
      - completion
  signature_policy:
    problem_line: "아~ 어질어질합니다."
    problem_line_only_when:
      - 실제 문제와 제약이 충분히 누적됐다
      - 과장 없이 난점을 요약할 수 있다
    pivot_line: "그래서 생각의 판을 완전히 엎었습니다."
    pivot_line_only_when:
      - 개입 대상 또는 기존 접근을 실제로 뒤집었다
      - 문장 직후 핵심 해결책을 공개한다
    maximum_each_per_video: 1
  length_policy:
    strategy: content_first
    minimum_sec: 30
    maximum_sec: 180
    compression_order:
      - extension
      - supporting
      - essential은 인과관계가 유지되는 한 보존

evidence_policy:
  preferred:
    - 정부 및 공공기관 기술 문서
    - 표준 기관 문서
    - 동료 심사 논문
    - 대학 및 연구기관 자료
    - 제조사 공식 기술 자료
  conditional:
    - 전문 기술 백과
    - 신뢰할 수 있는 공학 교육 자료
  discovery_only:
    - 위키백과
    - 일반 블로그
    - 커뮤니티 게시물
  required_for_pass:
    - 핵심 메커니즘을 독립 출처 2개 이상이 지지한다
    - 영상에 쓰는 수치와 단위가 근거 문장에 연결된다
    - 작용 방향과 인과관계가 확인된다
    - 논쟁 중인 해석과 영상적 단순화가 분리된다

shot_rules:
  create_new_shot_only_for:
    - 새로운 물리 상태
    - 하중 경로 변화
    - 시공 또는 작동 단계 변화
    - 내부 단면
    - 매크로 메커니즘
    - 규모 비교
    - 강한 인과 전환
  forbidden:
    - 같은 의미의 카메라 각도만 바꾼 중복 장면
    - TTS 길이만 맞추기 위한 장면 분할
    - 근거 없는 구조와 물리 현상

clean_contract:
  aspect_ratio: 9:16
  style: photoreal cinematic 3D engineering documentary
  required:
    - 실제 형상과 재료
    - 명시적인 물리 상태
    - 카메라 위치와 렌즈
    - 조명과 환경
    - 5도에서 15도 카메라 이동이 가능한 깊이
    - 장면별 오류 금지 조건
  forbidden:
    - text
    - numbers
    - symbols
    - arrows
    - UI
    - HUD
    - watermark

info_contract:
  mode: edit_same_clean
  typography:
    labels: Pretendard SemiBold
    values_and_units: Pretendard Bold
    forbidden:
      - serif
      - handwriting
      - decorative display fonts
      - condensed fonts
  preserve_exactly:
    - composition
    - camera
    - geometry
    - people
    - lighting
    - materials
    - background
  assembly_parts:
    - anchor
    - line
    - arrow_body
    - arrowhead
    - value
    - label
    - moving_pulse
  rules:
    - INFO 기본값은 none이며 CLEAN과 영상 자체로 의미가 읽히면 그래픽을 추가하지 않는다
    - 같은 TTS 구간에는 INFO 장면을 최대 1개만 사용하고 첫 도입 구간은 INFO를 사용하지 않는다
    - 보이는 물체 이름, 제작용 방위, 내레이션 반복 문구를 라벨로 붙이지 않는다
    - 라벨은 최대 2개이며 보이지 않는 인과, 하중 경로 또는 전후 차이에만 사용한다
    - 그래픽은 실제 3D 공간의 원근과 가림을 따른다
    - 화살표와 지시선은 실제 구조 또는 현상에 고정한다
    - 검증된 값과 단위만 사용한다
    - 한 장에는 핵심 개념 하나만 표시한다
    - 글자와 기호는 생성 모델의 임의 스타일이 아니라 승인된 오버레이 명세를 따른다
    - 금지 동작 화살표는 실제 목표를 향하고 접촉 전에 중단돼야 한다
    - 전후 비교에는 기준선, 이전 상태, 이후 상태와 둘 사이의 눈에 보이는 간격이 모두 있어야 한다
    - 방향이 정의되지 않은 장면에는 장식용 화살표를 만들지 않는다
    - 작은 글자도 배경과 충분한 대비 및 외곽선을 유지한다
    - 모든 INFO 라벨은 Pretendard SemiBold, 숫자와 단위는 Pretendard Bold만 사용한다

video_contract:
  duration_sec: 4
  first_frame: CLEAN
  last_frame: INFO
  timeline:
    - 0.0~0.4 CLEAN만 유지하고 카메라와 환경 움직임 시작
    - 0.4~0.9 실제 구조와 현상의 앵커점 점등
    - 0.9~1.7 지시선, 파면, 치수선, 화살표 몸통 생성
    - 1.7~2.6 작은 라벨과 값 조립 후 화살촉 생성
    - 2.6~3.4 하중, 압력, 유체, 재료 또는 공정 펄스 이동
    - 3.4~4.0 INFO 목표 상태에 수렴하고 안정적으로 유지
  none_info_rule: INFO가 none인 장면은 그래픽 조립 없이 CLEAN 기반의 절제된 카메라와 실제 환경 움직임만 사용한다
  forbidden:
    - narration
    - dialogue
    - music
    - new_caption
    - logo
    - watermark
