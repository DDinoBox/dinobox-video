id: history
name: 역사
starter_domain: true
positioning: >
  인물 암기보다 사건의 압력, 선택, 이동, 결과를 시각적으로 설명하는
  시네마틱 역사 쇼츠 도메인.
core_questions:
  - label: 핵심 질문
    prompt: 왜 이 사건이나 선택이 중요했는가?
  - label: 핵심 갈등
    prompt: 어떤 세력, 조건, 제약이 충돌했는가?
  - label: 보이는 흐름
    prompt: 사람, 군대, 물자, 돈, 정보, 권력, 영토 중 무엇이 이동했는가?
  - label: 전환점
    prompt: 어느 결정, 장소, 기술, 실수, 우연이 결과를 바꾸었는가?
story_structure:
  - 불안정한 배경
  - 충돌하는 이해관계
  - 실패 가능성 확대
  - 결정적 선택 또는 사건
  - 흐름의 변화
  - 결과와 파급
  - 다른 해석 또는 한계
  - 짧은 결론
visual_focus:
  - 지도와 이동 경로
  - 도시와 전장 또는 궁정의 공간 구조
  - 군대, 물자, 돈, 정보, 권력의 흐름
  - 시대별 의복, 건축, 교통, 무기, 문서
  - 전환점이 되는 장소와 선택
source_policy:
  - 공식 박물관, 기록보관소, 대학, 학술 출판물, 1차 사료 번역을 우선한다.
  - 연도, 장소, 인명, 수량은 출처가 있을 때만 단정한다.
  - 논쟁 중인 해석은 확정 사실처럼 말하지 않는다.
  - 영상적 단순화는 대본 또는 출처 메모에 표시한다.
fact_gate:
  pass:
    - 핵심 주장, 연도, 인물, 장소, 사건 순서가 신뢰 가능한 자료로 확인된다.
    - 원인과 결과의 연결이 사료 또는 연구와 크게 어긋나지 않는다.
    - 논쟁 중인 해석을 확정 사실과 구분해 표현할 수 있다.
  hold:
    - 흥미로운 소재지만 핵심 주장의 출처가 부족하다.
    - 자료마다 연도, 장소, 인물, 사건 순서가 충돌한다.
    - 시각화할 수는 있지만 추가 확인 없이는 오해가 커질 수 있다.
  reject:
    - 핵심 주장이 틀렸거나 출처가 확인되지 않는다.
    - 쇼츠로 단순화하면 결정적인 거짓 인과관계가 된다.
    - 시대착오, 허위 인물 특정, 과장된 자극에 의존해야만 흥미가 생긴다.
clean_rules:
  - 글자, 숫자, 지도 라벨, 자막, UI, 워터마크를 넣지 않는다.
  - 시대와 지역에 맞는 복식, 건축, 지형, 사물을 유지한다.
  - 후속 카메라 움직임을 위한 전경, 중경, 배경 깊이를 둔다.
  - 콜라주, 분할 화면, 스토리보드 형태로 만들지 않는다.
info_rules:
  - CLEAN의 구도와 시대 재현을 보존한다.
  - 경로선, 세력권, 짧은 라벨, 핵심 연도 0~1개만 사용한다.
  - 지도식 그래픽은 실제 지형 또는 장면 공간에 고정한다.
  - 거대한 제목이나 긴 문장형 설명을 피한다.
video_rules:
  - CLEAN에서 시작해 INFO 그래픽이 순서대로 조립되게 한다.
  - 카메라는 5~15도 정도의 절제된 돌리, 오비트, 트래킹만 사용한다.
  - 경로, 세력권, 문서, 인물 동선은 방향과 인과관계가 읽히게 움직인다.
review_checklist:
  - 대본의 사건 순서가 맞는가?
  - 시대와 장소가 이미지에 맞게 반영됐는가?
  - 인물, 복식, 건축, 무기가 시대착오적이지 않은가?
  - 지도나 경로가 실제 지리와 크게 어긋나지 않는가?
  - 확정 사실과 해석을 구분했는가?
  - 한 장면이 한 가지 핵심 변화만 보여주는가?
forbidden:
  - 가짜 연도와 가짜 수치
  - 실제 인물을 허위로 특정하는 묘사
  - 현대 물건이 섞인 시대착오
  - 자극적 장면을 사실처럼 과장
  - 거대한 텍스트 타이틀 중심 구성
